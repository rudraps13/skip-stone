<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A one-button game about skipping stones across a mountain lake at sunset.">
<title>Skip Stone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2327365e'/%3E%3Cstop offset='1' stop-color='%23f6b06b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='8' fill='url(%23s)'/%3E%3Ccircle cx='27' cy='21' r='5' fill='%23ffe3b0'/%3E%3Cpath d='M0 24L9 17L16 22L24 15L32 21L40 18V26H0Z' fill='%231f1a26'/%3E%3Crect y='26' width='40' height='14' fill='%23233046'/%3E%3Cellipse cx='14' cy='31' rx='8' ry='1.6' fill='none' stroke='%23ffe3b0' stroke-width='1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a full-screen mountain lake at sunset, painted on canvas; a quiet HUD floats over it. Single dusk look by choice. */
:root{
  color-scheme: dark;
  --dusk:#1b1a2b; --glass:rgba(20,16,28,.55); --text:#f7eee3; --soft:rgba(247,238,227,.72); --sun:#ffd89a;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--dusk);color:var(--text);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;cursor:pointer}
.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;gap:28px;align-items:flex-start;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.stat .k{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.stat .v{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.mute{margin-left:auto;pointer-events:auto;background:var(--glass);border:1px solid rgba(247,238,227,.2);color:var(--text);border-radius:999px;padding:7px 14px;font:600 12px var(--body);letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(6px)}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;font-family:var(--display);font-style:italic;font-size:20px;color:var(--text);text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;padding-inline:16px}
.card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,8,16,.25)}
.card[hidden]{display:none}
.card .in{max-width:430px;width:100%;text-align:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(247,238,227,.18);border-radius:16px;padding:30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(44px,11vw,60px);line-height:1;margin:0 0 14px;color:var(--sun)}
.card p{margin:0 0 10px;line-height:1.55;color:var(--soft)}
.card p b{color:var(--text)}
.card .row{display:flex;justify-content:center;gap:28px;margin:12px 0 8px}
.card .row b{display:block;font-family:var(--display);font-weight:500;font-size:46px;line-height:1;color:var(--text)}
.card .row span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.btn{margin-top:14px;background:var(--sun);color:#2a1d14;border:0;border-radius:999px;padding:13px 28px;font:600 15px var(--body);cursor:pointer}
.btn:focus-visible,.mute:focus-visible{outline:2px solid var(--text);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" aria-label="A mountain lake at sunset with a wooden dock"></canvas>
<div class="hud">
  <div class="stat"><span class="k">Skips</span><span class="v" id="skips">0</span></div>
  <div class="stat"><span class="k">Distance</span><span class="v" id="dist">0 m</span></div>
  <div class="stat"><span class="k">Best</span><span class="v" id="best">0 m</span></div>
  <button class="mute" id="mute" type="button">Sound on</button>
</div>
<div class="hint" id="hint"></div>
<div class="card" id="card"></div>

<script>
/* ---------- setup ---------- */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const topC=document.createElement('canvas'), tc=topC.getContext('2d');     // sky, mountains, far shore
const nearC=document.createElement('canvas'), nc=nearC.getContext('2d');   // dock, person, posts, stone
const cloudC=document.createElement('canvas'), cc=cloudC.getContext('2d');
let W,H,D,WY,SY;
const GRAV=900, PX_PER_M=20, START_X=70, HAND=70;

const RT=new Float32Array(1024); { let s=12345; for(let i=0;i<1024;i++){ s=(s*16807)%2147483647; RT[i]=s/2147483647; } }
function vnoise(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); const a=RT[i&1023], b=RT[(i+1)&1023]; return a+(b-a)*u; }
function fbm(x,o){ let s=0,a=.5,f=1; for(let k=0;k<(o||4);k++){ s+=a*vnoise(x*f+k*31.7); a*=.5; f*=2.03; } return s; }

function resize(){
  D=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  WY=Math.round(H*.5); SY=Math.round(WY+(H-WY)*.42);
  for(const [c,x,h] of [[cv,ctx,H],[topC,tc,WY],[nearC,nc,H]]){ c.width=W*D; c.height=h*D; x.setTransform(D,0,0,D,0,0); }
  buildClouds();
}
function buildClouds(){
  const cw=Math.round(W*1.6), ch=Math.round(WY*.75);
  cloudC.width=cw*D; cloudC.height=ch*D; cc.setTransform(D,0,0,D,0,0);
  let k=0;
  for(let n=0;n<9;n++){
    const cx=RT[k++]*cw, cy=ch*(.15+RT[k++]*.75), sz=40+RT[k++]*90;
    for(let p=0;p<14;p++){
      const px=cx+(RT[k++]-.5)*sz*3, py=cy+(RT[k++]-.5)*sz*.35, r=sz*(.3+RT[k++]*.5);
      for(const [dy,col] of [[0,'rgba(92,76,120,.22)'],[r*.25,'rgba(255,170,130,.22)']]){
        cc.save(); cc.translate(px,py+dy); cc.scale(3.2,1);
        const g=cc.createRadialGradient(0,0,0,0,0,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
        cc.fillStyle=g; cc.beginPath(); cc.arc(0,0,r,0,7); cc.fill(); cc.restore();
      }
    }
  }
}
addEventListener('resize',resize); resize();

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let best=0; try{best=+localStorage.getItem('skipstone-best')||0;}catch(e){}
let cam=0; const hand={x:0,y:0}; const ripples=[], drops=[];
function newState(st){ return {state:st,x:START_X,y:-HAND,vx:0,vy:0,spin:0,skips:0,perfects:0,charge:0,chargeT:0,tapped:false,tapLead:0,grace:0,msg:'',msgT:0,endT:0,throwT:-1}; }
let S=newState('menu');

/* ---------- sound ---------- */
let AC=null, master=null, muted=false; try{muted=localStorage.getItem('skipstone-muted')==='1';}catch(e){}
function audio(){
  if(AC) return; try{
    AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=muted?0:.7; master.connect(AC.destination);
    const src=AC.createBufferSource(); src.buffer=noiseBuf(3); src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
    const g=AC.createGain(); g.gain.value=.05; const lfo=AC.createOscillator(); lfo.frequency.value=.18; const lg=AC.createGain(); lg.gain.value=.03;
    lfo.connect(lg); lg.connect(g.gain); src.connect(lp); lp.connect(g); g.connect(master); src.start(); lfo.start();
  }catch(e){ AC=null; }
}
function noiseBuf(sec){ const b=AC.createBuffer(1,Math.floor(AC.sampleRate*sec),AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function burst(dur,f0,f1,q,gain){
  if(!AC) return; const n=AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseBuf(dur);
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=q; f.frequency.setValueAtTime(f0,n); f.frequency.exponentialRampToValueAtTime(f1,n+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(gain,n); g.gain.exponentialRampToValueAtTime(.001,n+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(n);
}
function blip(f0,f1,dur,gain){
  if(!AC) return; const n=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.frequency.setValueAtTime(f0,n); o.frequency.exponentialRampToValueAtTime(f1,n+dur);
  g.gain.setValueAtTime(gain,n); g.gain.exponentialRampToValueAtTime(.001,n+dur); o.connect(g); g.connect(master); o.start(n); o.stop(n+dur);
}
function tone(f,start,dur,gain,type){
  if(!AC) return; const n=AC.currentTime+start, o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,n); g.gain.exponentialRampToValueAtTime(gain,n+.02); g.gain.exponentialRampToValueAtTime(.0001,n+dur);
  o.connect(g); g.connect(master); o.start(n); o.stop(n+dur+.05);
}
const sfx={
  windup(){ burst(.5,300,900,.6,.08); },
  throw(){ burst(.28,700,2200,.7,.14); },
  skip(p){ burst(.16,2600,900,1.3,.45); blip(p?1300:950,p?2100:1400,.07,.12);
    if(p){ tone(1568,.02,.35,.05,'triangle'); tone(2093,.07,.4,.04,'triangle'); } },
  glide(){ burst(.9,1800,500,.5,.12); },
  plunk(){ burst(.5,700,140,.9,.7); blip(320,110,.16,.35); },
  best(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.6,.07,'triangle')); },
  bird(){ const f=2400+Math.random()*1400; for(let i=0;i<2+Math.floor(Math.random()*3);i++){ const n=AC.currentTime+i*.13, o=AC.createOscillator(), g=AC.createGain();
    o.frequency.setValueAtTime(f,n); o.frequency.exponentialRampToValueAtTime(f*1.35,n+.07); g.gain.setValueAtTime(.0001,n); g.gain.exponentialRampToValueAtTime(.025,n+.02); g.gain.exponentialRampToValueAtTime(.0001,n+.1);
    o.connect(g); g.connect(master); o.start(n); o.stop(n+.12); } },
};
setInterval(()=>{ if(AC && !muted && !document.hidden && Math.random()<.5) sfx.bird(); },4000);
function setMute(m){ muted=m; if(master) master.gain.value=m?0:.7; document.getElementById('mute').textContent=m?'Sound off':'Sound on'; try{localStorage.setItem('skipstone-muted',m?'1':'0');}catch(e){} }
document.getElementById('mute').addEventListener('click',e=>{ e.stopPropagation(); audio(); setMute(!muted); });
setMute(muted);

/* ---------- game ---------- */
function reset(){ S=newState('ready'); ripples.length=0; drops.length=0; hud(); hint('Press and hold to wind up. Let go to throw.'); }
function hint(s){ document.getElementById('hint').textContent=s; }
const dist=()=>Math.max(0,Math.round((S.x-START_X)/PX_PER_M));
function hud(){ document.getElementById('skips').textContent=S.skips; document.getElementById('dist').textContent=dist()+' m'; document.getElementById('best').textContent=best+' m'; }
function say(m){ S.msg=m; S.msgT=1; }
function timeToWater(){ const a=.5*GRAV,b=S.vy,c=S.y, disc=b*b-4*a*c; return disc<0?0:(-b+Math.sqrt(disc))/(2*a); }

function press(){
  audio();
  if(S.state==='ready'){ S.state='charging'; S.chargeT=0; hint('Let go to throw'); sfx.windup(); }
  else if(S.state==='flying' && !S.tapped){ S.tapped=true; S.tapLead=timeToWater(); }
  else if(S.state==='touch') skip(false,true);
}
function release(){
  if(S.state!=='charging') return;
  const p=S.charge;
  S.x=hand.x+cam; S.y=Math.min(-20,hand.y-SY);
  S.vx=260+420*p; S.vy=-(120+260*p); S.state='flying'; S.tapped=false; S.throwT=0; sfx.throw();
  hint('Tap as the shrinking ring meets the gold ring');
}
function skip(perfect,late){
  S.skips++; if(perfect) S.perfects++;
  S.vy=-Math.abs(S.vy)*(perfect?.86:.74); S.vx*=perfect?.97:.9; S.y=0; S.state='flying'; S.tapped=false;
  say(perfect?'Perfect':late?'Just in time':'Skip');
  rings(S.x,perfect?1.3:1); splash(S.x,perfect?16:10,.8); sfx.skip(perfect);
  if(Math.abs(S.vy)<70||S.vx<110){ S.state='settling'; say('It glides to a stop'); sfx.glide(); }
  hud();
}
function sink(why){ S.state='sinking'; S.endT=0; say(why); rings(S.x,1.5); splash(S.x,26,1.4); sfx.plunk(); hint(''); }
function rings(x,s){ for(let i=0;i<3;i++) ripples.push({x,r:-i*14,s:s*(1-i*.15),life:1}); }
function splash(x,n,power){
  if(reduce) return;
  for(let i=0;i<n;i++){ const up=Math.random()<.5; const a=up?-Math.PI/2+(Math.random()-.5)*.5:-Math.PI*(.12+Math.random()*.76);
    const v=(up?160:90)*power+Math.random()*120*power; drops.push({x,y:0,vx:Math.cos(a)*v+S.vx*.25,vy:Math.sin(a)*v,life:.6+Math.random()*.5}); }
}

function update(dt){
  if(S.state==='charging'){ S.chargeT+=dt; S.charge=(1-Math.cos(S.chargeT*Math.PI/.7))/2; }
  if(S.throwT>=0) S.throwT+=dt;
  if(S.state==='flying'){
    S.vy+=GRAV*dt; S.x+=S.vx*dt; S.y+=S.vy*dt; S.spin+=dt*16;
    if(S.y>=0 && S.vy>0){
      S.y=0;
      if(S.tapped){ if(S.tapLead<=.07) skip(true); else if(S.tapLead<=.3) skip(false); else sink('Too early'); }
      else { S.state='touch'; S.grace=.1; }
    }
  } else if(S.state==='touch'){ S.x+=S.vx*dt; S.grace-=dt; if(S.grace<=0) sink('Plunk. Too late');
  } else if(S.state==='settling'){ S.vx*=Math.pow(.25,dt); S.x+=S.vx*dt; S.spin+=dt*S.vx/40; S.y=0; if(S.vx<25) sink('Plip');
  } else if(S.state==='sinking'){ S.endT+=dt; S.y=Math.min(34,S.y+38*dt); S.x+=S.vx*dt*.08; if(S.endT>1.4) finish(); }
  for(const r of ripples){ r.r+=48*dt*r.s; r.life-=dt*.55; }
  for(let i=ripples.length-1;i>=0;i--) if(ripples[i].life<=0) ripples.splice(i,1);
  for(const d of drops){ d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=GRAV*.8*dt; d.life-=dt; }
  for(let i=drops.length-1;i>=0;i--) if(drops[i].life<=0||drops[i].y>3) drops.splice(i,1);
  if(S.msgT>0) S.msgT-=dt*.7;
  const target=Math.max(0,S.x-W*.38); cam+=(target-cam)*Math.min(1,dt*3.5);
  if(S.state!=='done') document.getElementById('dist').textContent=dist()+' m';
}
function finish(){
  S.state='done'; const d=dist(); let rec=false;
  if(d>best){ best=d; rec=true; sfx.best(); try{localStorage.setItem('skipstone-best',best);}catch(e){} }
  hud(); hint('');
  card(`<h1>${rec?'A new best':S.skips>=8?'A lovely throw':S.skips>=4?'A good throw':'Plunk'}</h1>
    <div class="row"><div><b>${S.skips}</b><span>skips</span></div><div><b>${d}</b><span>metres</span></div><div><b>${S.perfects}</b><span>perfect</span></div></div>
    <p>Best: <b>${best} m</b></p><button class="btn" id="go">Pick up another stone</button>`);
}

/* ---------- painting the far world ---------- */
function ridge(g,par,base,amp,scale,seed,color){
  g.fillStyle=color; g.beginPath(); g.moveTo(0,WY);
  for(let x=0;x<=W+4;x+=4){ const wx=x+cam*par; g.lineTo(x,base-amp*fbm(wx*scale+seed)); }
  g.lineTo(W,WY); g.closePath(); g.fill();
}
function renderTop(t){
  const g=tc, sunX=W*.7, sunY=WY-H*.075, sr=Math.max(16,H*.034);
  const sky=g.createLinearGradient(0,0,0,WY);
  sky.addColorStop(0,'#27365e'); sky.addColorStop(.35,'#5e5488'); sky.addColorStop(.62,'#d1817e'); sky.addColorStop(.86,'#f4ab6c'); sky.addColorStop(1,'#ffd89a');
  g.fillStyle=sky; g.fillRect(0,0,W,WY);
  // glow
  g.globalCompositeOperation='lighter';
  let gl=g.createRadialGradient(sunX,sunY,0,sunX,sunY,H*.55); gl.addColorStop(0,'rgba(255,196,120,.55)'); gl.addColorStop(.25,'rgba(255,150,100,.18)'); gl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gl; g.fillRect(0,0,W,WY);
  g.globalCompositeOperation='source-over';
  // clouds, drifting
  const off=((t*4+cam*.03)%(W*.6));
  g.drawImage(cloudC,-off,0,cloudC.width/D,cloudC.height/D);
  // sun, slightly flattened by the horizon air
  g.save(); g.translate(sunX,sunY); g.scale(1,.92);
  const sd=g.createRadialGradient(0,0,0,0,0,sr); sd.addColorStop(0,'#fffaf0'); sd.addColorStop(.7,'#ffe7b8'); sd.addColorStop(1,'#ffcf8a');
  g.fillStyle=sd; g.beginPath(); g.arc(0,0,sr,0,7); g.fill(); g.restore();
  // birds
  g.strokeStyle='rgba(40,28,44,.75)'; g.lineWidth=1.3; g.lineCap='round';
  for(let i=0;i<4;i++){ const bx=((RT[i+700]*W+t*(14+i*3))%(W+80))-40, by=WY*(.25+RT[i+710]*.25)+Math.sin(t*.6+i)*6, f=Math.sin(t*7+i*2)*3, s=4+RT[i+720]*2;
    g.beginPath(); g.moveTo(bx-s,by-f); g.quadraticCurveTo(bx-s*.4,by-f*.3-1,bx,by); g.quadraticCurveTo(bx+s*.4,by-f*.3-1,bx+s,by-f); g.stroke(); }
  // mountain ranges, hazier with distance
  ridge(g,.04,WY,H*.22,.0022,3,'#9b7b9d');
  ridge(g,.09,WY,H*.13,.0045,17,'#6c5579');
  const hz=g.createLinearGradient(0,WY-H*.2,0,WY); hz.addColorStop(0,'rgba(255,190,140,0)'); hz.addColorStop(1,'rgba(255,186,140,.38)');
  g.fillStyle=hz; g.fillRect(0,WY-H*.2,W,H*.2);
  ridge(g,.16,WY,H*.07,.008,41,'#43364f');
  // pine forest on the far shore
  g.fillStyle='#1d1824'; g.beginPath(); g.moveTo(0,WY);
  for(let x=0;x<=W+3;x+=3){
    const wx=x+cam*.25, hill=WY-H*.012-H*.025*fbm(wx*.01+60,3);
    const tree=Math.floor(wx/9), tall=(5+RT[tree&1023]*16)*Math.max(.6,H/800), ph=((wx%9)+9)%9/9, tri=1-Math.abs(ph*2-1);
    g.lineTo(x,hill-tall*tri);
  }
  g.lineTo(W,WY); g.closePath(); g.fill();
  // thin mist on the waterline
  const mist=g.createLinearGradient(0,WY-10,0,WY); mist.addColorStop(0,'rgba(255,200,160,0)'); mist.addColorStop(1,'rgba(255,200,160,.25)');
  g.fillStyle=mist; g.fillRect(0,WY-10,W,10);
  return {sunX};
}

/* ---------- painting the near world ---------- */
function renderNear(t){
  const g=nc; g.clearRect(0,0,W,H);
  const dx=START_X-cam;
  // distance stakes every 10 m
  g.textAlign='center'; g.font='600 10px Manrope, sans-serif';
  const first=Math.max(1,Math.floor((cam-START_X)/(PX_PER_M*10)));
  for(let m=first;m<first+W/(PX_PER_M*10)+2;m++){
    const x=START_X+m*10*PX_PER_M-cam; if(x<-20||x>W+20) continue;
    g.fillStyle='#2a201d'; g.fillRect(x-2,SY-34,4,34);
    g.fillStyle='#b9a68d'; g.fillRect(x-11,SY-46,22,12); g.fillStyle='#2a201d'; g.fillText(m*10,x,SY-37);
  }
  // dock
  if(dx>-40){
    const x0=dx-340, top=SY-16;
    for(let p=dx-8;p>x0;p-=62){ g.fillStyle='#241a17'; g.fillRect(p,top,7,16); }
    g.fillStyle='#3a2a24'; g.fillRect(x0,top,dx-x0,7);
    g.fillStyle='#2a1e1a'; for(let p=x0;p<dx;p+=13) g.fillRect(p,top,1,7);
    g.fillStyle='rgba(255,176,110,.55)'; g.fillRect(x0,top,dx-x0,1);
    drawPerson(g,dx-30,top);
  }
  // stone in hand or in the air
  if(S.state==='menu'||S.state==='ready'||S.state==='charging') drawStone(g,hand.x,hand.y,0);
  else if(S.y<=0 && S.state!=='sinking') drawStone(g,S.x-cam,SY+S.y-2,S.spin);
}
function drawStone(g,x,y,spin){
  g.save(); g.translate(x,y); g.rotate(Math.sin(spin)*.12);
  const sg=g.createLinearGradient(0,-4,0,4); sg.addColorStop(0,'#6a6062'); sg.addColorStop(1,'#272224');
  g.fillStyle=sg; g.beginPath(); g.ellipse(0,0,8.5,3.4,0,0,7); g.fill();
  g.strokeStyle='rgba(255,190,130,.75)'; g.lineWidth=1; g.beginPath(); g.ellipse(0,0,8.5,3.4,0,Math.PI*1.05,Math.PI*1.95); g.stroke();
  g.restore();
}
function drawPerson(g,px,feet){
  // follow-through after the throw eases back to standing
  let crouch=.25, arm=2.5;
  if(S.state==='charging'){ crouch=.45+.45*S.charge; arm=2.5+S.charge*.7; }
  else if(S.throwT>=0){ const k=Math.min(1,S.throwT/1.2); crouch=.9-.65*k; arm=.15+k*2.1; }
  const hipX=px, hipY=feet-40+crouch*9, shX=px+6+crouch*10, shY=feet-73+crouch*16;
  g.save(); g.shadowColor='rgba(255,150,90,.55)'; g.shadowBlur=9;
  g.strokeStyle='#140f17'; g.fillStyle='#140f17'; g.lineCap='round'; g.lineJoin='round';
  g.lineWidth=7; g.beginPath(); g.moveTo(hipX,hipY); g.lineTo(px-14,feet); g.stroke();
  g.beginPath(); g.moveTo(hipX,hipY); g.lineTo(px+10,feet-19+crouch*5); g.lineTo(px+19,feet); g.stroke();
  g.lineWidth=15; g.beginPath(); g.moveTo(hipX,hipY-4); g.lineTo(shX,shY+6); g.stroke();
  g.beginPath(); g.arc(shX+4+crouch*3,shY-11,7.5,0,7); g.fill();
  g.lineWidth=5.5;
  g.beginPath(); g.moveTo(shX,shY+2); g.lineTo(shX+15,shY+12); g.lineTo(shX+26,shY+6); g.stroke();
  const ex=shX+19*Math.cos(arm), ey=shY+2+19*Math.sin(arm), hx=ex+17*Math.cos(arm-.35), hy=ey+17*Math.sin(arm-.35);
  g.beginPath(); g.moveTo(shX,shY+2); g.lineTo(ex,ey); g.lineTo(hx,hy); g.stroke();
  g.restore();
  hand.x=hx; hand.y=hy;
}

/* ---------- frame ---------- */
function draw(now){
  const t=now/1000, waterH=H-WY;
  const {sunX}=renderTop(t);
  ctx.drawImage(topC,0,0,W,WY);
  // water body
  const wb=ctx.createLinearGradient(0,WY,0,H); wb.addColorStop(0,'#5b5274'); wb.addColorStop(1,'#141b29');
  ctx.fillStyle=wb; ctx.fillRect(0,WY,W,waterH);
  // reflection of sky and mountains, rippled
  for(let y=0;y<waterH;y+=2){
    const src=WY-1-y*.8; if(src<1) break;
    const depth=y/waterH, off=Math.sin(y*.23+t*1.8)*(.4+y*.035)+Math.sin(y*.071-t*1.1)*(1+y*.02);
    ctx.globalAlpha=.78-.5*depth;
    ctx.drawImage(topC,0,Math.floor(src*D),W*D,2*D,off,WY+y,W,2);
  }
  ctx.globalAlpha=1;
  // the closer the water, the less it mirrors
  const sh=ctx.createLinearGradient(0,WY,0,H); sh.addColorStop(0,'rgba(18,22,40,0)'); sh.addColorStop(1,'rgba(12,16,28,.62)');
  ctx.fillStyle=sh; ctx.fillRect(0,WY,W,waterH);
  // sun glitter
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<190;i++){
    const r1=RT[i], r2=RT[i+200], r3=RT[i+400], depth=r1*r1;
    const a=Math.pow(Math.max(0,Math.sin(t*(1.5+r3*4)+i*1.7)),6); if(a<.04) continue;
    const y=WY+2+depth*(waterH-4), spread=12+depth*W*.22, x=sunX+(r2-.5)*2*spread*(.25+r3*.75);
    ctx.fillStyle=`rgba(255,222,165,${a*.85})`; ctx.fillRect(x,y,2+depth*12,1+depth*1.6);
  }
  ctx.globalCompositeOperation='source-over';
  // gentle swell lines
  for(let i=0;i<22;i++){
    const depth=(i+1)/22, y=WY+depth*depth*waterH, len=20+depth*90, gap=90+depth*260;
    const off=((cam*(.3+depth)+t*(6+depth*14))%gap+gap)%gap;
    ctx.strokeStyle=`rgba(8,12,22,${.1+depth*.18})`; ctx.lineWidth=.6+depth*1.6;
    for(let x=-off+RT[i+800]*gap;x<W+len;x+=gap){ ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+len/2,y+1+depth*2,x+len,y); ctx.stroke(); }
  }
  // near world and its reflection
  renderNear(t);
  for(let y=0;y<150 && SY+y<H;y+=2){
    const src=SY-1-y; if(src<0) break;
    const off=Math.sin(y*.3+t*2.2)*(1+y*.06);
    ctx.globalAlpha=.42*(1-y/150);
    ctx.drawImage(nearC,0,Math.floor(src*D),W*D,2*D,off,SY+y,W,2);
  }
  ctx.globalAlpha=1;
  // ripples and foam
  for(const r of ripples){ if(r.r<=0) continue;
    ctx.strokeStyle=`rgba(255,226,196,${r.life*.55})`; ctx.lineWidth=1.4; ctx.beginPath(); ctx.ellipse(r.x-cam,SY,r.r,r.r*.18,0,0,7); ctx.stroke();
    if(r.life>.7){ ctx.fillStyle=`rgba(255,245,235,${(r.life-.7)*1.6})`; ctx.beginPath(); ctx.ellipse(r.x-cam,SY,9*r.s,2.2,0,0,7); ctx.fill(); } }
  ctx.drawImage(nearC,0,0,W,H);
  // sinking stone, seen through the water
  if(S.state==='sinking'){ ctx.globalAlpha=Math.max(0,.6-S.endT*.45); drawStone(ctx,S.x-cam,SY+S.y,0); ctx.globalAlpha=1; }
  // spray
  for(const d of drops){ ctx.strokeStyle=`rgba(255,238,220,${Math.max(0,d.life)*.9})`; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(d.x-cam,SY+d.y); ctx.lineTo(d.x-cam-d.vx*.012,SY+d.y-d.vy*.012); ctx.stroke(); }
  // timing rings
  if(S.state==='flying' && !S.tapped){
    const tt=timeToWater(), ax=S.x+S.vx*tt-cam;
    if(tt<1.1){
      ctx.strokeStyle='rgba(255,216,154,.95)'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(ax,SY,15,3.2,0,0,7); ctx.stroke();
      const R=15+tt*140; ctx.strokeStyle=`rgba(255,255,255,${.85-tt*.5})`; ctx.lineWidth=1.4; ctx.beginPath(); ctx.ellipse(ax,SY,R,R*.21,0,0,7); ctx.stroke();
    }
  }
  // power
  if(S.state==='charging'){
    const mx=START_X-cam-20, my=SY-128;
    ctx.fillStyle='rgba(20,16,28,.45)'; ctx.fillRect(mx-42,my,84,4);
    ctx.fillStyle=S.charge>.85?'#ffd89a':'rgba(247,238,227,.85)'; ctx.fillRect(mx-42,my,84*S.charge,4);
    ctx.font='italic 500 17px "Cormorant Garamond", serif'; ctx.textAlign='center'; ctx.fillStyle='#f7eee3'; ctx.fillText(S.charge>.85?'now':'power',mx,my-8);
  }
  // words
  if(S.msgT>0 && S.msg){
    ctx.globalAlpha=Math.min(1,S.msgT*1.6); ctx.font='italic 500 32px "Cormorant Garamond", serif'; ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=10; ctx.fillStyle=S.msg==='Perfect'?'#ffd89a':'#f7eee3';
    ctx.fillText(S.msg,Math.min(W-90,Math.max(90,S.x-cam)),SY-80-(1-S.msgT)*26); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  // vignette
  const vg=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.35,W/2,H*.55,Math.max(W,H)*.8);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(8,4,14,.5)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ---------- loop, cards, input ---------- */
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(S.state!=='menu'&&S.state!=='done') update(dt); draw(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

function card(html){ const c=document.getElementById('card'); c.innerHTML=`<div class="in">${html}</div>`; c.hidden=false; const b=c.querySelector('button'); if(b) b.focus(); }
const onCard=()=>!document.getElementById('card').hidden;
card(`<h1>Skip Stone</h1>
  <p>A flat stone, a still lake, the last of the sun. Make it skip as many times as you can.</p>
  <p><b>Hold</b> to wind up, <b>let go</b> to throw. Then <b>tap</b> just as the stone meets the water, when the white ring shrinks onto the gold one.</p>
  <button class="btn" id="go">Pick up a stone</button>`);
document.getElementById('card').addEventListener('click',e=>{ if(e.target.id==='go'){ e.stopPropagation(); audio(); document.getElementById('card').hidden=true; reset(); } });

cv.addEventListener('pointerdown',e=>{ if(onCard()) return; e.preventDefault(); press(); });
addEventListener('pointerup',()=>{ if(!onCard()) release(); });
addEventListener('keydown',e=>{ if(e.repeat) return; if((e.code==='Space'||e.code==='Enter') && !onCard() && e.target.tagName!=='BUTTON'){ e.preventDefault(); press(); } });
addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='Enter') release(); });
document.addEventListener('visibilitychange',()=>{ last=performance.now(); });
hud();
</script>
